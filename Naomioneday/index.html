      position: absolute;

      left: 50%;

      width: 110px;
      height: 110px;

      border-radius: 50%;

      background: #4fc3f7;

      display: flex;
      justify-content: center;
      align-items: center;

      text-decoration: none;

      z-index: 6;

      box-shadow:
        0 4px 20px rgba(0,0,0,.35);

      transition:
        transform .2s ease,
        box-shadow .2s ease;

      transform:
        translate(-50%, -50%)

      box-shadow:
        0 6px 30px rgba(0,0,0,.50);
    }

    /* PLAY ICON */
    .watch-button::after {
      content: "";

      height: 0;

      border-radius: 6px;

      text-align: center;

      overflow: visible;

      z-index: 9999;
    }

    #histats_counter {
      position: relative;

      left: auto;
      top: auto;

      width: auto;
      height: auto;

      min-width: 50px;
      min-height: 20px;

      overflow: visible;

      opacity: 1;

      pointer-events: auto;

      z-index: 10000;
    }


    /* PROGRESS BAR */
    .progress {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      width: 100%;
      height: 6px;

      background:

      z-index: 7;
    }

    .bar {
      width: 38%;
      height: 100%;

      background: #ff0000;
    }

        width: 90px;
        height: 90px;
      }

        border-top-width: 20px;
        border-bottom-width: 20px;
        border-left-width: 30px;
      }

      .top-bar {
        padding: 20px 25px;
        font-size: 16px;
      }

      .top-bar span {
        padding: 8px 16px;
      }

      .progress {
        height: 5px;
      }

      #histats-area {

      }
